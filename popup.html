<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>哔哩喵 Bili-Mux</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <header class="head">
      <div class="logo">哔哩喵<span class="tag">Bili-Mux</span></div>
      <div class="ver" id="ver">v1.1.2</div>
    </header>

    <section class="notice">
      <strong>使用边界（务必阅读）</strong>
      <p>本工具<em>仅解析你账号本就有权播放的流</em>，用于<em>个人留存、学习</em>。
      请勿用于<em>批量搬运</em>或<em>二次分发</em>，由此产生的版权/账号风险由使用者自行承担。</p>
    </section>

    <section class="block">
      <h3>怎么用</h3>
      <ol>
        <li>进入任意 <span class="pink">Bilibili</span> 视频页。</li>
        <li>视频工具栏<span class="pink">「点赞」「投币」「收藏」「转发」</span>旁边的粉色<span class="pink">「保存」</span>按钮，点开即是下载面板。</li>
      </ol>
    </section>

    <section class="block">
      <h3>说明</h3>
      <ul>
        <li>直链带过期时间，解析后请尽快下载。</li>
        <li>清晰度上限由你的登录态决定。</li>
        <li>封面为静态直链，直接下载。</li>
      </ul>
    </section>

    <footer class="foot">
      <button id="open" class="primary">打开 Bilibili</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
